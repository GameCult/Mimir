workspace:
  name: Mimir
  status: active
  focus: direct-driver-fensalir-stream-app
  implementation_name: Mimir public surface / native runtime contracts
  premise: >
    Mimir is the local realtime field machine: cameras, microphones, speakers,
    network feeds, and timing signals become one coherent OBS-facing volumetric
    program surface. The live path is a C# Fensalir-hosted app with in-memory
    rolling buffers and native capture/runtime boundaries.

objective:
  primary: >
    Build one synchronized spatial stream machine from six cameras, six
    microphones, two speakers, Leap timing, Fensalir GPU rendering, Faust DSP,
    and OBS output.
  current: >
    Build the Mimir editor as a 2D OBS-shaped program mixer first: synced video
    streams become compositable program layers, audio streams remain mixable
    stems, and telemetry stays on Odin's Nightwing TUI/CultMesh surface instead
    of stealing editor space. Leap/3D calibration work remains important, but
    it is not the live editor authority for this pass.

constraints:
  - Sender is Windows.
  - Receiver uses OBS.
  - Video encode must use NVENC when the bridge path is active.
  - Audio sources must remain separately controllable in OBS.
  - V1 bridge is LAN-only.
  - Persistent state must clarify rehydrate, not become transcript tax.
  - Live ingest belongs to Mimir.Runtime, native drivers, Fensalir, and
    Faust/native DSP.
  - Edge JSON is schema/diagnostic only; live process data is typed or in
    memory.
  - Networked feeds are producers into the live runtime, not independent clock
    authorities.
  - Mimir explicitly trades latency and memory for throughput and field quality:
    the default five-second buffer is compute budget for stream alignment,
    GPU/audio analysis, and volumetric sound-field extraction.

invariants:
  - OBS composition authority stays in OBS.
  - FFmpeg owns capture, encoding, and transport only for bridge utilities.
  - One stable bridge port equals one OBS source endpoint.
  - One rolling live window owns the timing edge and expiry.
  - The rolling window is not accidental latency. It must preserve enough time
    to line up feeds and crunch data before OBS-facing output is emitted.
  - Typed views may index the rolling buffer, but no per-kind ring owns
    retention.
  - Fensalir owns production UI, GPU fusion, D3D12 interop, Spout2 output, and
    the EVE shared D3D12 program-output texture.
  - Mimir publishes physical observations, calibration constraints, and surface
    intent. Fensalir owns field claims, selected lowerings, evidence reservoirs,
    temporal guide lanes, and program presentation.
  - The Mimir editor is currently a 2D program mixer. `MimirSceneEditorState`
    owns normalized video-layer placement for synced video streams and emits
    only video-source preview items; camera/SDF/model authoring has no live UI
    authority, and editor camera/SDF/spline output must not contribute to the
    runtime frame.
  - Fast stereo depth belongs to Fensalir's D3D12 compute/resource authority.
    `research/d3d12-stereo-depth-provenance-2026-05-29.md` records libSGM as
    the permissive north-star reference for a future SGM-shaped stereo
    disparity lane over synchronized rectified texture pairs and calibration
    state. CUDA, TensorRT, and monocular depth demos are provenance only, not
    live dependencies or geometry authority.
  - The first stereo-depth contract is code-visible:
    `MimirStereoDepthConfigurations` names the libSGM-provenance D3D12 SGM
    profile, and `MimirFensalirFieldLowering.BuildStereoDepthCandidateFrame`
    references caller-declared shader-readable left/right Texture2D resources,
    then lowers rectified stereo depth into a compute-writable R16F disparity
    SurfacePage, R8 confidence Texture2D, a Height FieldEvidence claim, and an
    `AquariumFieldStereoDepthLowering` sidecar tying profile, calibration,
    camera pair, inputs, disparity output, SGM constants, and depth range
    together. `BuildLeapPackedStereoDepthCandidateFrame` is the live Leap cut:
    it recognizes a live `LeapStereoIr` rolling video window, reuses the
    declared packed R8G8 texture as both left and right resource identity,
    names the left/right observations as packed R/G lanes, and emits the same
    depth lowering from the runtime frame. The current libSGM-provenance D3D12
    SGM profile publishes min disparity 0, 128 disparities, four aggregation
    paths, census radius 2, P1 8, and P2 96. Fensalir now has a first
    packed-Leap D3D12 SAD/block-match kernel that writes R16F disparity through
    the typed SurfacePage socket; full SGM and calibrated metric depth remain
    future work.
  - The first Leap point-cloud root is code-visible:
    `MimirPointCloudConfigurations.LeapDisparityPointCloudRoot` records the
    stereo-disparity projection profile and provenance, and
    `MimirFensalirFieldLowering.BuildLeapPackedStereoPointCloudCandidateFrame`
    declares a GPU-resident `FieldMesh` PointList resource derived from the
    Leap disparity SurfacePage. `MimirRuntime` merges that Mesh claim with the
    live Leap stereo-depth claim. `Mimir.BufferSmoke --leap-point-cloud-root-smoke`
    proves one `SurfacePage` packet plus one `Mesh` packet and zero deferred
    requests. Fensalir branch `codex/leap-packed-depth` now owns the matching
    first native surface-claim lane: generated PointList Mesh buffers are
    filled from the disparity SurfacePage on D3D12 for diagnostics, while the
    same compute pass writes approximated normals, curvature, SDF, PBR, and
    radiosity data into Fensalir's splat reservoir buffers. The point-list draw
    path is diagnostic-only; live presentation goes through Fensalir's
    splat/reservoir resolver. The live proof
    `artifacts/runtime/mimir-leap-surface-claims-clean.png` showed LeapUVC
    frames uploaded through a Fensalir-owned D3D12 texture, packed stereo depth
    dispatch-ready/dispatched, 19,200 generated surface claims, point-list
    rendering at `rendered 0`, and visible reservoir-resolved Leap splats.
    The follow-up proof
    `artifacts/runtime/mimir-leap-history-split-shader-visible.png` ran without
    `AQUARIUM_DISABLE_RESERVOIR_HISTORY`: Fensalir now compiles a dedicated lean
    `D3D12ReservoirHistoryUpdate.hlsl` for current-sample history/resolved
    output instead of compiling the monolithic post shader as a compute entry.
    The 2026-05-31 all-sensor proof uses
    `config/mimir-runtime.perfect-machine.local.json`: Leap packed stereo IR,
    both PS3 Eyes at 320x240@187, Kiyo Pro RGB, and regular Kiyo RGB all open
    through `MimirRuntime` and enter as Fensalir texture leases.
    `Mimir.BufferSmoke --perfect-machine-live-smoke` now requires five live
    camera Texture2D resources, one Leap stereo-depth lowering, one disparity
    SurfacePage, and one derived point-cloud Mesh. The Fensalir headless run
    started all five sources, declared eight field resources, resolved six
    Texture2D resources, dispatched the packed-Leap stereo-depth kernel,
    generated one point-cloud/surface stream, reported 19,200 visible reservoir
    splats, and captured
    `artifacts/runtime/mimir-perfect-machine-all-sensors-headless.png`.
    Generic camera Feature/SensorObservation claims now plan through Fensalir's
    `GpuSensorFusion` backend with zero deferred requests. The first dispatch
    samples LeapStereoIr plus both Bayer8 PS3 Eyes, generates 49,152 sparse
    gaussians at about 0.059 ms/frame sensor-fusion GPU time, and captured
    `artifacts/runtime/mimir-perfect-machine-gpu-feature-extraction-headless.png`.
    The follow-up YUY2 decode proof samples LeapStereoIr, both Bayer8 PS3 Eyes,
    Kiyo Pro YUY2, and regular Kiyo YUY2; it dispatches five camera textures
    with zero unsupported field textures, generates 81,920 sparse gaussians at
    about 0.08 ms/frame sensor-fusion GPU time, and captured
    `artifacts/runtime/mimir-perfect-machine-yuy2-gpu-feature-extraction-headless.png`.
    Packed video must not masquerade as ordinary RGBA: Fensalir binds
    `DXGI_FORMAT_YUY2` through the documented `R8G8B8A8_UNORM` SRV view and
    decodes `Y0/U/Y1/V` in compute.
    Calibrated projection constants, full SGM, temporal/spatial reservoir reuse
    in a compilable shader, and global residual/calibration ownership remain
    open.
  - LED strips on performers are active visual calibration evidence, not fake
    depth. `MimirLedSplineFieldCandidate` carries per-camera ordered bright
    curve observations in image pixels and local clipspace/frustum coordinates
    with optional temporal code / stable LED indices, and
    `MimirFensalirFieldLowering.BuildLedSplineCandidateFrame` lowers them as
    deterministic camera-sensor Feature claims that Fensalir plans as
    `DebugOverlay` calibration evidence. Exact cross-camera correspondence
    requires addressable/blink-coded LEDs or another identity source; uncoded
    identical LEDs remain useful curve constraints but cannot own camera pose.
    `MimirLedSplineCurveSolver` now solves ordered per-sensor image/clipspace
    curves from bright detections. `MimirCameraRigCalibrationSolver` consumes
    stable LED indices plus a scene-space LED curve anchor and emits bounded
    camera translation updates by minimizing ray-to-curve distance. Rotation,
    focal length, and distortion are still future calibration cuts. Exposure
    and gain sweeps must optimize `MimirLedSplineQualityScorer` output:
    recovered LED count, curve coverage, spacing coherence, smoothness,
    exposure fitness, and saturation penalty decide whether a setting is
    usable for calibration. `MimirLedSplineFrameAnalyzer` now extracts bright
    luma components from real frames into the same score path, so clipped blobs
    can be detected while still rejected as bad spline evidence.
    `Mimir.BufferSmoke --led-spline-live-score` now scores actual direct sensor
    feeds. KS/UVC sources sweep manual exposure/gain before each live scoring
    window and print a best setting per source; the 2026-05-31 live proof with
    `--expected-leds 38 --minimum-luma 0.55` selected exposure `-9`, gain `8`
    for both Kiyo Pro and Kiyo Basic. LeapUVC rejected the generic KS
    exposure/gain writes and PS3 Eye capture remains fixed-control until its
    native wrapper owns gain/exposure.
  - PS Move is usable as an active marker/IMU witness, not as an optical depth
    owner. `Mimir.PsMoveProbe` now enumerates Sony `VID_054C` / `PID_03D5`
    through Windows HID without third-party packages. The connected controller
    exposes three collections: a generic desktop gamepad collection with
    49-byte input/output/feature reports and two vendor-defined feature-report
    collections. USB report decoding should own identity/buttons/IMU and later
    LED sphere control; camera observations of the sphere should enter the
    existing global calibration evidence path.
    `--pair-host <bdaddr>` now writes the target Bluetooth host to the
    controller through feature report `0x05` on the `col02` collection. The
    first live controller `00:06:f5:23:e2:d1` was written with Nightwing's
    host address `5c:93:a2:9c:a8:a8`. Nightwing BlueZ is installed and
    registered with the PS Move API Linux BlueZ record shape, so the
    controller now connects wirelessly as `Motion Controller` and exposes
    `/dev/input/js0`, `/dev/input/event14`, and `/dev/hidraw1`.
    `tools/nightwing_psmove_music_pulse.py` proves the output path by reading
    Starfire Scarlett ASIO loopback channels 2/3, computing a thresholdable
    Perlines-style adaptive-whitened spectral-delta novelty function, fitting
    a provisional fundamental, folding spectral bin energy into one octave
    around that fundamental for RGB balance, and streaming LED report `0x06`
    frames over SSH to Nightwing's hidraw writer. The LED idles near black.
    Onset amplitude ranks the current whitened-delta broadband flux against a
    recent rolling history and emits `percentile^exponent`, so exponent `2`
    makes a median notable frame 25% brightness while the strongest recent
    rises approach full brightness. The ASIO reader now drains the native
    capture queue to the newest loopback blocks before each LED frame, because
    stale queued audio was the plausible seconds-late music-pulse cause.
    `tools/move_latency_probe.py` is the diagnostic PS Move latency receipt:
    PS3 Eyes are the default fast visual witnesses, Scarlett cardioid is the
    default chirp timing witness, and the event train uses an order-3 de Bruijn
    schedule with symbol-coded chirp bands, LED colors, and small variable
    gaps. The probe writes `event-schedule.json`, arms Nightwing's LED script
    before playback, fits audio/video detections back to the known schedule,
    and marks receipts invalid when the Move sphere is not visible enough.
    Live encoded Eye/Scarlett testing recovered all eight visual events with
    schedule residuals within about 4 ms; `ffplay`/DirectShow audio startup is
    still too soft for final physical latency authority, so native timestamped
    Scarlett playback/capture remains the production timing cut.
    `tools/music_keyed_move_chirp_sync.py` now writes articulated calibration
    word plans where one `mimir.music_keyed_move_chirp_plan.v1` owns beat/key
    selection, symbol sequence, chirp contours, and per-Move sampled RGB visual
    contours. `tools/sync_sweep.py --music-plan` consumes that same plan as the
    shared capture authority: it plays/copies the chirp train, sends exact Move
    contour samples over Nightwing HID, scores RGB camera receipts with a
    `visual_contour` brightness/color decoder block, and runs Mimir
    perfect-machine live receipts for local Leap/Kiyos and Raven/Eve configs
    unless disabled. DirectShow/Nightwing media capture remains an archive and
    diagnostic path; Leap/Eve presence is now explicit in typed Mimir receipts
    rather than silently inferred. `tools/crunch_sync_sweep.py` turns a sweep
    directory into `calibration-observations.json/csv` by merging Nightwing's
    typed Move observations with local Kiyo frame-derived marker centroids.
    The ASAP streaming MVP is narrower and authority-correct:
    `config/mimir-runtime.mvp-leap-eyes-kiyo.local.json` keeps Starfire's live
    rolling buffers to local Scarlett ASIO, local Leap stereo IR, and local
    Kiyo Pro RGB only. Nightwing's PS3 Eyes do not cross as raw video; the
    `start-mvp-leap-eyes-kiyo.ps1` launcher stages Nightwing tools and starts
    `nightwing_typed_witness_publisher.py --track-eyes`, so Nightwing publishes
    compact `mimir.move_controller_observation_state.v1` claims through the
    `/eve/periwinkle` CultMesh observation receiver.
    The stream-proof profile is the live demo cut:
    `config/mimir-runtime.stream-proof.local.json` keeps Starfire's canonical
    window on local Scarlett ASIO, local Leap stereo IR, local Kiyo Pro RGB,
    and Raven display/audio from one muxed Raven NVENC/AAC MPEG-TS SRT stream
    on port 5200. `scripts/start-raven-av-sender.ps1` captures Raven's desktop
    through FFmpeg `ddagrab` Desktop Duplication API plus NVENC and captures
    Raven's Realtek/default render
    loopback through the compiled `Mimir.WasapiLoopback` helper when staged at
    `tools/Mimir.WasapiLoopback/Mimir.WasapiLoopback.exe`; the older
    PowerShell loopback reader is now only a diagnostic fallback. BtbN current
    FFmpeg was tested on Raven and still exposes no native `wasapi` input
    device, so loopback capture cannot be solved by swapping FFmpeg builds
    alone. Raven's local `ddagrab + Mimir.WasapiLoopback + AAC + h264_nvenc`
    proof recorded 568 frames in ten seconds at 1080p60; sparse-frame direct
    TCP/SSH proof captures are therefore transport/proof-path evidence, not
    Raven GPU/capture evidence. `scripts/start-raven-av-demux.ps1`
    is the Starfire local demux edge, copying video to local SRT port 5210 and
    decoding audio to f32 PCM on local SRT port 5212 for Mimir's current raw
    ingest adapters. `MimirFfmpegPcmAudioStreamSource` owns the post-demux PCM
    edge and emits real `MimirAudioBlockDescriptor` samples instead of generic
    process bytes. `scripts/start-stream-proof.ps1` stages Nightwing's compact
    Eye/Move publisher and keeps only one `--track-eyes` worker alive.
    `tools/solve_stream_proof_frustum.py`
    turns articulated sweep observations into a provisional Kiyo AR trail
    receipt: Nightwing matched views define a temporary local witness space,
    Kiyo observations are fit into it, and the output
    `mimir.stream_proof_frustum_solve.v1` is calibration evidence for the demo,
    not final metric room truth.
    Raven display sync is explicit: audio-derived timing states for
    `raven-realtk-loopback` now carry the `raven-sync` clock domain from the
    source descriptor, and `MimirSynchronizedBufferPlanner` applies that earned
    correction to every buffer in the same domain, including `raven-display`.
    The LAN Raven path is now one muxed A/V transport; the local split is only
    a Starfire demux boundary for Mimir's raw video/PCM source adapters.
    `MimirMoveControllerTracker` is the first Mimir-native overlay owner for
    multiple PS Move controllers: it tracks bright sphere observations from
    PS3 Eye luma frames, keeps a bounded history per `controllerId`, preserves
    the commanded expected RGB identity for each controller, and lowers those
    histories into Feature evidence without claiming solved 6DoF pose.
    `Mimir.BufferSmoke --move-controller-overlay-smoke` proves two distinct
    controller histories produce one valid FieldEvidence claim/candidate.
    `config/mimir-runtime.move-stream.local.json` is the first show profile:
    Kiyo Pro program view, both PS3 Eyes as Move trackers, Scarlett ASIO
    labeled as shotgun/cardioid/Raven loopback, and Raven display over SRT
    port 5200.
    Nightwing is now modeled as the dedicated Eyes/Moves witness body rather
    than a vague remote helper: it owns PS3 Eye USB reads, PS Move
    Bluetooth/HID, LED schedules, device timestamps, and compact
    marker/feature extraction receipts. Starfire keeps the canonical rolling
    window, Scarlett timing, global residuals, Kiyo/Raven program sync, and
    OBS publication. Fensalir keeps D3D12 dense feature/fusion work, surface
    claims, and splat/reservoir presentation. The
    `nightwing-eyes-moves-witness` config and `nightwing-eyes-moves` Perfect
    Machine profile emit typed Move observation, camera feature-track, and
    visual marker state; raw Eye media from Nightwing is diagnostic only and
    Nightwing does not own camera placement or the canonical clock.
    Eve follows the same distributed-witness rule for its own body:
    `eve-local-sensor-witness` / `eve-local-sensors` owns Eve camera, Eve mic,
    local flash/chirp decode, feature tracks, visual markers, and local frustum
    hints. It may send compact typed evidence, but raw Eve media is not global
    placement authority and Eve never owns the canonical clock.
    `MimirCameraFrustumCalibrationSolver` is now the first Starfire-owned
    frustum solve: stable LED/marker correspondences plus scene-space marker
    points and seed frustums produce per-source position, rotation,
    horizontal/vertical tangent half-FOV, correspondence count, clipspace
    reprojection residual, and confidence. This supersedes translation-only
    rig updates for global fusion setup; the older
    `MimirCameraRigCalibrationSolver` remains a narrow bounded translation
    residual helper. The same solver also consumes
    `MimirFeatureTrackFieldCandidate` plus scene-space `TrackId` anchors, so
    PS Move sphere histories, Eye feature tracks, and Eve-local marker tracks
    can enter the frustum solve without becoming a separate authority.
    `mimir.local_frustum_hint_state.v1` is the typed CultMesh document for
    publishing those local solved hints: producer node, calibration id,
    candidate key, marker set id, per-camera pose/frustum snapshot, residual,
    point count, and confidence. Starfire may ingest this as evidence; it is
    still not canonical placement until the global solve accepts it.
    `Mimir.BufferSmoke --frustum-calibration-smoke` proves five LED-spline
    frustums and five feature-track frustums for both Eyes, Kiyo Pro, Leap
    stereo IR, and Eve camera, then lowers the feature-track solve into a
    `mimir.local_frustum_hint_state.v1` document.
    The Eyes have physically moved to Nightwing and Linux sees them as stock
    `ov534`/`gspca` V4L2 cameras on `/dev/video2` and `/dev/video3`. A
    repo-owned `tools/nightwing_v4l2_cadence_probe.py` copied to Nightwing
    proved both devices can deliver 320x240 at about 187 fps with zero
    sequence gaps when the worker explicitly sets `VIDIOC_S_PARM`
    `timeperframe=1/187`; default V4L2 streaming remains a false 30 fps signal.
  - PS3 Eyes now have a first sparse tracking surface instead of only cadence
    proof. `MimirSparseFeatureTracker` detects Bayer/luma corner features,
    links them into sensor-local tracks with clipspace position, velocity, age,
    and confidence, and `MimirFeatureTrackFieldCandidate` lowers them as
    camera Feature claims. `Mimir.BufferSmoke --ps3eye-tracking-live` proved a
    one-second 320x240@187 run can return 160 live tracks from each Eye: 160
    stable tracks from `ps3-eye-0` and 156 stable tracks from `ps3-eye-1` with
    sensitive defaults. This is CPU diagnostic/bootstrap work;
    Fensalir D3D12 feature extraction remains the production owner.
  - Fensalir packet payload handles are not authority. Live payload references
    must resolve through declared typed GPU/native resources with shape,
    residency, shader access, validity, version, and handle metadata before
    shader lowering can consume them.
  - EVE fullscreen output must use native decode/composite over Fensalir-owned
    program pixels; WebKit/DOM layout is forbidden as pixel authority.
  - Faust/native DSP owns hot audio alignment, separation, spatialization, and
    stems.
  - Local secrets remain untracked.
  - Mimir is a CultMesh app. Codebooks, schedules, calibration receipts, path
    response, and compute-offload work need typed mesh-syncable state surfaces
    so phones, microcontrollers, Raven, and Starfire can cooperate without
    becoming independent timing authorities.

accepted_design:
  - `Mimir.slnx` owns the app surface.
  - `src/Mimir.App` launches Fensalir as host/window/D3D12 library.
  - `src/Mimir.Runtime` owns `MimirSynchronizationHub`,
    `MimirRollingStreamBuffer`, stream descriptors, `IMimirStreamSource`,
    direct native ingest, process bridge ingest, and video capture driver seams.
  - `MimirVideoFrameDescriptor` carries width, height, pixel format, stride,
    device timestamp, and optional native/GPU handle.
  - `MimirEveProgramOutputConfigurations.NativeSharedTexture` records the
    EVE-facing program-output contract: Fensalir publishes
    `Global\MimirFensalirProgramTexture` when
    `FENSALIR_PROGRAM_OUTPUT_D3D12=1`; EVE receives decoded native pixels and
    owns only final composite/input uplink.
  - `src/Mimir.EveRelay` is the current EVE dashboard transport slice:
    it opens the named D3D12 program-output texture, feeds low-latency H.264
    (`h264_nvenc` by default), frames Annex-B access units over `/stream`, and
    reports `/health`. EveCanvas uses `AVSampleBufferDisplayLayer` for native
    decode/composite. The local launch script opens an SSH reverse tunnel to
    Eve when Windows firewall policy blocks direct inbound TCP, and EveCanvas
    tries localhost before the LAN host.
  - `src/Mimir.Broadcast` is the first self-hosted public edge sender:
    Starfire uses FFmpeg/NVENC to push one final H.264/AAC RTMP stream through
    an SSH local forward to Yggdrasil. Yggdrasil owns nginx RTMP ingest and HLS
    segment serving only; it does not transcode or compose. The public viewer
    route is `https://gamecult.org/livestream`, and it reads the existing
    Yggdrasil-routed StreamPixels URL
    `https://streampixels.gamecult.org/mimir/live/hls/mimir.m3u8`. The deployed
    Yggdrasil origin already validates, listens on localhost RTMP
    `127.0.0.1:1935`, and produced HLS segments from an eight-second Starfire
    synthetic NVENC push on 2026-05-30. Dedicated Mimir-site and
    `live.mimir.gamecult.org` viewer/media hostnames are not needed for v1.
  - `MimirAudioBlockDescriptor` carries sample rate, channels, sample format,
    frame count, timestamp, and optional native handle.
  - `MimirFrameEventProcessStreamSource` is a temporary diagnostic adapter for
    JSON-line video frame and audio block metadata from native probes into
    runtime rolling buffers; it does not carry pixels/audio payloads or own the
    final local-device hot path.
  - `MimirBioacousticTimeline` is the active runtime watermark. It renders a
    low-gain birdsong-like word language with 128 self-identifying word
    positions, left-speaker and right-speaker variants, four formant-rich
    syllables per word, rhythm variation, and direct word identity instead of a
    de Bruijn grammar. The active receiver is a song-contour anchor machine:
    one heard call should expose syllable timing, contour bends, formants,
    payload ornaments, speaker tint, and log-mel evidence as a cluster of
    time/frequency anchors. `MimirRuntime` emits separate panned vocabularies
    per speaker. `MimirAudioSynchronizationAnalyzer` reports active timing as
    `evidence=bioacoustic`; the old chirp-bin path remains a
    calibration/reference artifact with ASIO tooling.
  - The diagnostic audio path can optionally carry base64 float sample payloads
    for sync smoke tests. `MimirChirpletTimeline` owns the older structured
    chirplet reference fingerprint: an order-3 de Bruijn sequence over 32
    time/frequency constellation symbols, plus PCM segment rendering, matched
    timing atoms, symbol/event decoding, and per-band response kernels. Symbol
    identity is carried by start band, glide shape, duration, and following
    inter-chirp gap. Any three consecutive correctly detected symbols identify a
    timeline event within the current operating horizon. `MimirChirpletSymbolCodebook`
    owns the 32 symbol definitions so every symbol has a unique chirp shape, with
    rhythm as additional evidence. `MimirChirpletStreamDecoder` is the first
    constrained chirplet-transform receiver: it owns a bounded PCM window, emits
    transform frames with multiple phase-invariant symbol candidates and refined
    per-candidate sample offsets, decodes code-valid triplet anchors through
    gap/clock coherence, and fits a per-source sample clock from those anchors.
    Its synthetic smoke path is `dotnet run --project
    .\src\Mimir.BufferSmoke\Mimir.BufferSmoke.csproj -- --chirplet-self-test`.
    It currently decodes all 15 emitted chirps in a two-second window into 13
    anchors for events 0-12 with a 47999.999990 Hz clock fit and 0.000014 sample
    MAE. `MimirAudioSynchronizationAnalyzer`
    now treats `loopback-scarlett-speakers` as timing authority and derives
    delay only from matched decoded timeline anchors. Positive delay means
    the candidate mic is late relative to loopback. Reports include rounded
    delay, fractional delay, confidence, and per-band matched energy. `MimirSynchronizationHub`
    caches the latest per-source reports and `MimirAudioSynchronizationStateTracker`
    owns the smoothed per-source belief: latest delay, smoothed delay,
    confidence, per-band response evidence, and delay-slope/SRO estimate in
    ppm. `MimirRuntime` now runs this analysis online as a bounded rotating
    service on a fixed cadence, while UI and telemetry read cached reports/states
    instead of invoking analysis. `MIMIR_SYNC_TELEMETRY_SECONDS` prints live
    buffer/report/state telemetry. `MimirAudioSynchronizationSettings.Mode`
    now owns the active evidence policy: `chirp-only` emits the calibration
    witness, `passive` stays silent and uses program-audio phase correlation,
    and `hybrid` emits active pilot chunks only while passive confidence is
    weak. `MimirPassiveAudioSynchronizationEstimator` is the first passive path:
    it uses PHAT-weighted cross-spectrum correlation between loopback and mic
    windows before any watermark is needed. Negative passive lags are
    contradictory evidence and carry zero confidence; single-window passive
    confidence is capped below certainty until repeated state earns it.
    `MimirBioacousticTimeline` is now the active calibration witness for both
    chirp-only and hybrid: 128 self-identifying word positions, left/right
    speaker variants, four formant-rich syllables per word, rhythm variation,
    and direct word identity so any correctly decoded word identifies one
    canonical timeline location. The analyzer refines final active delay with constrained local
    waveform correlation around the decoded anchor delay. Each detected motif
    carries per-band response evidence, and the next calibration cut should use
    those profiles to tune contours, formants, usable bands, gain, and rhythm
    weighting. `Mimir.BufferSmoke --bioacoustic-cepstral-smoke` now proves the
    non-brute-force receiver direction: degraded mel-cepstral calls are decoded
