    generated mesh path is fed by real Mimir evidence rather than only the DSL
    smoke. The legacy direct `AquariumSplineFrame` spectrum dashboard is silent:
    `MimirRuntime` submits an empty spline frame and the old direct spectrum
    spline builder has been deleted. Live spectrum samples are now normalized
    into a row-major Float32 matrix, declared as
    `mimir:resource:spectrum:field-upload`, uploaded into a Fensalir-owned
    GPU-resident structured buffer, and consumed by the TubeField lowering.
    `Mimir.BufferSmoke --mimir-spectrum-upload-smoke` verifies the live
    `MimirRuntime` frame path emits that Float32 upload and planned TubeField
    packet while direct spline and buffer-field dashboard inputs remain empty.
    The runtime spectrum path also declares the local blackbody PNG as a
    GPU-resident Texture2D field resource and binds the TubeField material by
    `RampResourceKey`.
    Runtime spectrum columns now represent flattened `(history age, source
    lane)` pairs. Mimir emits one TubeField claim/lowering per active source.
    The spectrum resource advertises fixed history and source-lane capacities
    so frame content versions and source topology changes do not resize the GPU
    buffer while the rolling trail fills. `MIMIR_SPECTRUM_SOURCE_LANES` sets
    the lane capacity; surplus sources are truncated and reported in the
    runtime UI. Lowerings use that capacity as `ColumnStride` through the
    shared Float32 resource so each active lane renders a true age trail at
    `z = age * 0.1`. Physical history slots are addressed as a ring with
    `RollingOffset`, so logical age no longer requires moving every column in
    the upload matrix before shader sampling. Mimir emits one Float32 resource
    upload for the newest spectrum ring slot with an explicit element offset
    instead of uploading the full fixed-capacity backing buffer every frame.
    Fensalir owns rolling-slot validity and clamps TubeField dispatch so invalid
    older slots are not sampled after renderer allocation, reset, or partial
    update.
    `MIMIR_SPECTRUM_TUBE_SUBDIVISIONS` controls the Mimir-requested Catmull-Rom
    subdivisions so Fensalir's TubeField truncation report has a direct cost
    lever. Mimir's active proof path no longer uses the direct
    `AquariumAcousticFieldFrame` builder: sync states lower into FieldEvidence
    calibration constraints. Fensalir now selects AudioPath Phase/Confidence
    claims as DebugOverlay backend packets, so acoustic calibration evidence is
    planned and inspectable through the FieldEvidence authority. Acoustic source
    candidates and confidence volumes remain Phase 5 fusion work. The first
    synthetic acoustic source candidate proof now lowers an SRP/PHAT-style
    localization result with calibration/source identity and a world-space
    confidence envelope, and Fensalir plans it as a FieldEvidence DebugOverlay
    packet. Live room geometry still needs an explicit measured coordinate
    frame before those candidates become runtime truth. Phase 5's synthetic
    marker proof now lowers a deterministic multi-camera marker candidate with
    calibration/marker identity and world-space support, and Fensalir plans it
    as DebugOverlay evidence while ambiguous raw camera features still defer.
  - `config/perfect-machine.example.json` declares live owners, sensors,
    reservoir views, and runtime policy.
  - `src/Mimir.Runtime/Synchronization` now includes the Perfect Machine module
    library distilled from the research notes: node profiles, decoder/language
    profiles, path learning, benchmark panels, actuator strategies, capture and
    ingest strategies, reservoir strategies, field profiles, compute offload,
    OBS publication, CultMesh contracts, Fensalir lowering, and exportable
    manifest generation.
  - `docs/perfect-machine-module-library.md` indexes those reusable runtime
    modules and their smoke commands.
  - `docs/code-algorithm-map.md` is the source-level ownership and algorithm map
    for the current repo code surface.
  - `docs/perfect-machine-domain-index.md` indexes Mimir's full problem domain,
    current evidence taxonomy, hot paths, and implementation cuts.
  - `research/perfect-machine-study-2026-05-23/` preserves the architecture
    rumination, optimization ledger, research references, source/hotspot audits,
    Fensalir/native boundary maps, benchmark plan, calibration-session spec,
    distributed receiver spec, failure-mode ledger, data dictionary, low-level
    implementation notes, and sample code sketches for streaming chirp-bin
    decode, AVX2/GPU scoring, batched native ABI, fractional-delay/SRO
    actuation, acoustic source localization, Mimir-to-Fensalir lowering, and
    native capture rings. The corrected deep-study pass ran from
    `2026-05-23T23:54:42.9041588+01:00` through at least
    `2026-05-24T01:54:56.9747630+01:00`; use
    `research/perfect-machine-study-2026-05-23/reading-guide.md` as the
    re-entry index.
  - `.voidbot` state is part of repo memory and must be committed separately
    whenever dirty.

