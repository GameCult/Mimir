workspace:
  name: Mimir
  status: active
  focus: direct-driver-fensalir-stream-app
  implementation_name: Mimir public surface / native runtime contracts
  premise: >
    Mimir is the local realtime field machine: cameras, microphones, speakers,
    network feeds, and timing signals become one coherent Mimir-owned volumetric
    program surface. The live path is a C# Fensalir-hosted app with in-memory
    rolling buffers and native capture/runtime boundaries.

objective:
  primary: >
    Build one synchronized spatial stream machine from six cameras, six
    microphones, two speakers, Leap timing, Fensalir GPU rendering, Faust DSP,
    Eve operator surfaces, and Yggdrasil site publication.
  current: >
    Promote the active bioacoustic packet-song receiver into runtime state:
    self-identifying song contours should pin multiple time/frequency anchors
    per heard call, learn per-path response, and drive the audio actuator while
    direct camera/audio capture continues feeding Mimir.Runtime buffers.

constraints:
  - Sender is Windows.
  - OBS is a temporary compatibility sink, not a composition or broadcast authority.
  - Video encode must use NVENC when the bridge path is active.
  - Audio sources must remain separately controllable through Mimir/Eve and publishable as stems.
  - V1 bridge is LAN-only.
  - Persistent state must clarify rehydrate, not become transcript tax.
  - Live ingest belongs to Mimir.Runtime, native drivers, Fensalir, and
    Faust/native DSP.
  - Edge JSON is schema/diagnostic only; live process data is typed or in
    memory.
  - Networked feeds are producers into the live runtime, not independent clock
    authorities.
  - USB-attached Moves on Starfire and Nightwing are tracking witnesses. Muninn
    publishes source-local marker candidates plus controller/IMU/button state.
    Odin may discover/project their stream schemas, but it does not own pose
    capture or Mimir fusion.
  - CultMesh/CultNet is the default Raven-to-Starfire media transit. OBS may
    consume a Starfire-local UDP MPEG-TS egress as a compatibility sink, but
    Mimir owns program selection, composition, preview/control, and publication.
  - CultLib is moving every runtime's typed CultNet/CultMesh document transport
    to `cultnet.transport.rudp.v0`. Health, provider advertisements, command
    boundaries, transport profiles, and program/media document lanes should use
    RUDP by default. Product/debug render surfaces are lowerings,
    compatibility probes, or migration debt unless a specific runtime has not
    earned its RUDP path yet.
  - Daemon health and freshness are separate in authority from media transport,
    not separate because they need TCP. The old Mimir Eve dashboard broker is
    archived and no longer publishes Idunn health, deck routes, or WebSocket
    commands. Idunn owns continuity once Odin has accepted a daemon; Mimir-owned
    surfaces may only return as typed CultMesh/Odin state publishers.
  - Mimir explicitly trades latency and memory for throughput and field quality:
    the default five-second buffer is compute budget for stream alignment,
    GPU/audio analysis, and volumetric sound-field extraction.

invariants:
  - Mimir owns composition, preview/control state, source subscription policy,
    and program publication intent.
  - FFmpeg owns capture, encoding, and transport only for bridge utilities.
  - One stable bridge port equals one OBS source endpoint.
  - One rolling live window owns the timing edge and expiry.
  - The rolling window is not accidental latency. It must preserve enough time
    to line up feeds and crunch data before Mimir program output is emitted.
  - Typed views may index the rolling buffer, but no per-kind ring owns
    retention.
  - Fensalir owns GPU lowering for the Mimir program scene graph, D3D12 interop,
    and local program texture output.
  - Faust/native DSP owns hot audio alignment, separation, spatialization, and
    stems.
  - Eve GUI/TUI surfaces lower Mimir's operator controls, previews, and stats on
    any device without owning scene truth.
  - A Yggdrasil-facing publisher daemon consumes Mimir program output and
    publishes it to the site without owning composition.
  - Local secrets remain untracked.
  - Mimir is a CultMesh app. Codebooks, schedules, calibration receipts, path
    response, and compute-offload work need typed mesh-syncable state surfaces
    so phones, microcontrollers, Raven, and Starfire can cooperate without
    becoming independent timing authorities.
  - Move tracking observations are stream samples, not program controls or
    dashboard truth. Starfire-local and Nightwing-remote Move samples must enter
    Mimir.Runtime as typed tracking buffers before Fensalir or Eve acts on them.
  - Structured PS Move light pulses are Muninn output commands. Mimir requests
    `muninn.move_light_command.v1` over CultNet/CultMesh from the Muninn daemon
    on the host with the USB-attached Move; direct HID writes in Mimir scripts
    are temporary smoke/bootstrap edges only.

accepted_design:
  - Odin's 2026-07-16 Moonlight-derived reliability cut now runs Muninn and
    Sleipnir against the experimental CultLib runtime snapshot at `8965f3c0`.
    HID latest state and ordered button edges have separate epoch/sequence and
    application-ack semantics; wall timestamps no longer order input. Muninn
    media uses CultNet's unreliable `realtime` lane rather than the experimental
    reliable-without-expiry `media` lane, defaults LAN usefulness to 100 ms,
    bounds producer/pending queues, expires repair material, refuses repair for
    receiver-late frames, and reserves keyframe requests for decode-chain
    invalidation. Odin records the live authority and remaining gaps in
    `docs/realtime-delivery-authority.md`.
  - The Moonlight comparison at
    `docs/research/moonlight-muninn-sleipnir-study-2026-07-16.md` establishes
    that realtime delivery policy belongs to signal semantics, not generic RUDP
    reliability. Muninn media already owns access-unit boundaries, deadlines,
    video parity, dependency/keyframe metadata, receiver damage feedback, and a
    bounded repair cache; these foundations stay. The next transport cut must
    close feedback into sender pacing/bitrate/parity and derive retry/repair
    lifetime from video/audio consumption deadlines instead of the current
    broad two-second default. Sleipnir/Muninn input must explicitly separate
    replaceable latest state from ordered non-replaceable edges, coalesce before
    enqueue, acknowledge applied edge/state sequences, and use a proved clock
    model before reporting cross-host wall-clock subtraction as one-way latency.
  - Nightwing Muninn `d0eded6` now owns PSMoveAPI observation admission in each
    private Eye worker. It rejects stale, sub-2 px, out-of-frame, and
    discontinuous positions before the parent aggregates evidence; typed
    tracker health exposes rejection counts. PSMoveAPI age is no longer emitted
    as optical confidence: admitted candidates carry uncalibrated score `0.5`.
  - `MimirMoveSphereCalibrationFitter` owns the bounded two-Eye optical fit
    after spatial collection. Eye 0 defines the tracking-space gauge; a robust
    training consensus estimates both focal lengths and Eye 1 rigid pose, while
    a deterministic untouched 20 percent partition owns promotion evidence.
    Promotion requires low held-out median/P95 reprojection error and at least
    65 percent held-out consensus. Physical orb radius is explicit and never
    guessed. PSMoveAPI blob radius and position age are not calibrated sphere
    radius or optical confidence.
  - `Mimir.slnx` owns the app surface.
  - `src/Mimir.App` launches Fensalir as host/window/D3D12 library.
  - `src/Mimir.Runtime` owns `MimirSynchronizationHub`,
    `MimirRollingStreamBuffer`, stream descriptors, `IMimirStreamSource`,
    direct native ingest, process bridge ingest, and video capture driver seams.
  - `MimirVideoFrameDescriptor` carries width, height, pixel format, stride,
    device timestamp, and optional native/GPU handle.
  - `MimirAudioBlockDescriptor` carries sample rate, channels, sample format,
    frame count, timestamp, and optional native handle.
  - `MimirTrackingObservation` carries typed PS Move evidence samples as
    `mimir.move_tracking_observation.v1`; Starfire Moves are local tracking
    streams, Nightwing Moves are emitted by Muninn on Nightwing, Odin owns
    discovery/schema projection, and Mimir owns buffering and fusion.
  - `native/reservoir` now exposes a `move_evidence` typed view and
    `LocalcastMoveEvidenceBufferDescriptor` for compute-upload buffers carrying
    Muninn optical marker and controller-state witnesses before Mimir fusion.
  - `MimirNativeReservoirRuntime` loads the native reservoir DLL and pins Move
    evidence sample/descriptor batches so admitted native handles remain valid.
  - `MimirMuninnMoveEvidenceAdapter` mirrors Muninn's
    `muninn.move_marker_candidate.v1` and `muninn.move_controller_state.v1`
    document shapes and maps them into native Move evidence samples without
    claiming association or pose authority.
  - `MimirMuninnMoveEvidenceAdapter` also consumes
    `muninn.move_identity.v1` records into a deduped Move roster projection.
    The roster can show a controller as USB-visible on one Muninn host and
    Bluetooth-waiting/connected on Nightwing at the same time, so blind USB
    rotation remains inspectable without promoting identity-only records into
    motion evidence.
  - Realtime Muninn Move witnesses enter over CultMesh streaming frames. CultCache
    remains persistence/receipt/debug state, not the hot tracking feed.
  - `mimir.move_controller_pose.v1` is Mimir's resolved wand pose contract for
    Fensalir-facing interaction. Mimir owns calibration, association,
    triangulation, IMU fusion, prediction, confidence, and latency accounting.
  - `MimirMoveFusion` is the current Move pose owner. It consumes native Muninn
    Move evidence samples, refuses to publish poses without calibrated optical
    witnesses, triangulates multi-camera orb position, carries controller
    buttons/trigger/gyro into `mimir.move_controller_pose.v1`, and marks
    orientation as `orientation:imu-unresolved` until IMU fusion/prediction
    earns a full 6DoF controller contract.
  - `MimirMovePoseStream` publishes resolved Mimir-owned Move poses as
    `mimir.move_controller_pose_stream_frame.v1` CultMesh shared-memory byte
    frames for Fensalir and other realtime consumers; it carries poses and does
    not own calibration or fusion decisions.
  - `MimirMoveProofSurface` publishes the observer-only
    `mimir.move_proof_surface.v1` receipt and Fensalir spline probe for the
    named proof spine. It combines the Muninn evidence admission receipt, the
    Mimir-owned pose frame, and a Fensalir presentation/probe timestamp without
    becoming a pose owner. Single-ray fallback is surfaced as non-final; only
    triangulated calibrated optical marker evidence can earn a full-pose
    verdict.
  - `MimirMoveProofPipeline` is the single shared commit primitive for one
    Move proof frame. It reads a Muninn CultMesh evidence frame, admits native
    `move_evidence`, runs Mimir fusion, emits the Mimir pose frame, creates the
    proof surface, and returns the Fensalir spline probe. Direct user actions,
    programmatic smokes, and future live subscribers should use this same path
    so the proof chain does not split into separately repaired truths.
  - `MimirRuntime` now owns the actual Fensalir presentation attachment for
    Move proof surfaces. `PublishMoveProofSurface` accepts the latest
    Mimir-owned proof document, and `CreateFrame` composes its observer-only
    `move-proof-*` probe splines into `AquariumFrame.Scene.SplineFrame` beside
    the audio spectrum preview. Fensalir remains a renderer, not a proof
    authority.
  - `MimirMoveProofRuntimeDriver` is the runtime bridge from a Muninn CultMesh
    shared-memory evidence ring into `MimirRuntime.PublishMoveProofSurface`.
    It derives the Mimir evidence, Mimir pose, and Fensalir frame ids from the
    actual Muninn frame suffix, calls `MimirMoveProofPipeline`, and suppresses
    duplicate frame admission so the live loop cannot re-admit one frame and
    impersonate progress.
  - `MimirMoveProofRuntimeConfiguration` is the typed selection and validation
    surface for that runtime bridge. An enabled proof source names the Muninn
    evidence stream, native reservoir path, Mimir evidence/pose frame prefixes,
    Fensalir presented-frame prefix, fusion authority, consumer contract, and
    at least two calibrated camera witnesses. It may create a
    `MimirMoveProofRuntimeDriver` only when the supplied CultMesh ring stream id
    matches the configured evidence stream.
  - `MimirRuntime` owns configured Move proof activation. On scene-ready it asks
    an `IMimirMoveProofEvidenceRingProvider` for the evidence ring, opens the
    configured native reservoir, registers the runtime driver, retains the
    driver resources, and exposes activation status. The default provider fails
    explicitly because the current C# CultMesh ring is still in-process only;
    `Mimir.BufferSmoke --move-proof-runtime-activation-smoke` injects an
    in-process provider to prove the activation path without claiming live
    Nightwing/Starfire field evidence.
  - `mimir.move_proof_runtime_activation.v1` is the typed readiness/proof-spine
    surface for configured Move proof sources. It reports the configured stream,
    provider kind, active/driver state, native reservoir path, calibrated camera
    ids, latest same-stream proof ids, latest verdict, and unavailable-provider
    diagnostic. `Mimir.BufferSmoke --move-proof-runtime-activation-surface-smoke`
    proves both an active injected-ring document and the inactive default
    runtime document without claiming live field evidence.
  - `mimir.move_proof_evidence_frame_snapshot.v1` is the one-copy fallback for
    captured Muninn evidence frames while C# CultMesh has no cross-process ring
    opener. A configured `EvidenceSnapshotPath` is loaded by
    `MimirConfiguredMoveProofEvidenceRingProvider`, metadata-checked against the
    encoded payload, copied into an owned in-process ring, and then consumed by
    the same runtime driver/pipeline. `Mimir.BufferSmoke
    --move-proof-runtime-snapshot-smoke` proves the named proof spine through
    that file boundary. It is field capture/replay support, not the final live
    shared-memory proof.
  - Odin/Muninn can write the matching producer-side latest snapshot with
    `--move-evidence-snapshot <path>`. The snapshot is emitted by the same
    Muninn Move evidence publisher after the frame payload is accepted into the
    stream ring, and Odin's
    `move_evidence_snapshot_writes_mimir_compatible_frame_artifact` unit decodes
    both the `mimir.move_proof_evidence_frame_snapshot.v1` tuple and embedded
    Muninn payload. This supports Nightwing field capture/replay through Mimir's
    snapshot provider while the final live ring/page transport remains pending.
  - Nightwing field capture/replay has proven the one-copy snapshot mechanics,
    but the first `FullPose` replay was physically false-positive evidence.
    Muninn `d4f229a` bundles latest controller state with aggregated marker
    candidates from both Nightwing PS3 Eyes into one evidence frame, with the
    snapshot payload encoded as MessagePack bytes. The preserved artifact
    `artifacts/runtime/nightwing-move-proof-20260712-1041-aggregate.mpack`
    replays through `Mimir.BufferSmoke --move-proof-runtime-snapshot-file-smoke`
    as `muninn:nightwing:move-evidence:1 -> mimir:starfire:move-evidence:1 ->
    mimir:starfire:move-pose:1 -> fensalir:starfire:presented-frame:1`, but
    the operator confirmed the Move markers were dark during that capture. Treat
    its 99 marker candidates as bright image blobs/noise and use the artifact
    only as evidence that Muninn/Mimir/Fensalir replay plumbing works and needs
    marker-lit validation. A valid field pose proof still requires lighting the
    PS Move orb, capturing real optical marker candidates from calibrated camera
    witnesses, and preserving the explicit same-sequence proof spine. The final
    live cross-process CultMesh ring/page proof remains pending.
  - `MimirMoveProofDevSurface` is a dev-only bootstrap gated by
    `MIMIR_MOVE_PROOF_DEV_SURFACE`. It publishes a synthetic calibrated proof
    surface through the same MimirRuntime attachment so headless Mimir.App can
    capture and pixel-check a Fensalir-presented proof probe without making
    Fensalir a proof owner. It is renderer evidence, not field evidence.
  - `MimirMoveCalibrationProtocol` defines the runnable Starfire/Nightwing Move
    calibration preflight as typed state: required Muninn Move evidence streams,
    optional Quest headset/controller pose witnesses over USB,
    stillness/sweep/validation phases, and the calibration outputs Mimir must
    derive before orientation can stop being `orientation:imu-unresolved`.
  - Muninn owns Quest USB access as `muninn.quest_access.v1`. It proves ADB
    authorization/device identity for the optional external VR reference and
    advertises Quest input, pose, and warped-video input stream ids. Mimir
    consumes those surfaces for calibration; it does not publish Quest access.
  - Starfire should have Muninn for source-local Move HID control and local
    sensor publication, but some Starfire audio/video paths still enter Mimir
    through local Mimir producers or diagnostic process bridges while native
    drivers mature. Same-host Move evidence and pose frames are CultMesh
    shared-memory byte rings. Current remote media body transport is not
    same-machine zero-copy into Fensalir; Raven media uses CultNet/CultMesh
    documents over the mesh and lowers to local UDP only for OBS compatibility.
  - The old `scripts/start-nightwing-move-tracking.ps1` Nightwing Eye/Move
    witness path is archived. Starfire no longer owns a receiver/recorder
    socket lane for this evidence; Nightwing/Mimir witness publication must use
    typed CultMesh stream frames or Odin-discovered CultMesh documents.
  - Odin's Muninn organ owns Move optical candidate extraction in
    `E:\Projects\Odin\crates\muninn-move-tracker` and publishes/feeds
    `muninn.move_marker_candidate.v1` records. Mimir consumes those candidate
    streams; it does not own raw optical extraction. Mimir explicitly owns
    calibration, multi-camera association, triangulation, IMU fusion,
    prediction, and final 6DoF wand pose.
  - Muninn's Move evidence stream frame now uses canonical
    `muninn.move_marker_candidate.v1` records for optical candidates instead of
    a hardcoded empty marker slice. A daemon unit proves a bright Y8 frame
    extracted by `muninn-move-tracker` serializes as non-empty Mimir-compatible
    evidence. The daemon now has a source-local Y8 extraction/publish seam and
    a first `serve` camera producer: `--move-marker-camera <camera-id>=<device-path>`
    polls a Unix V4L2 YUYV frame, converts it to compact Y8, and feeds that
    same seam. Nightwing now runs one public Muninn provider whose two private
    per-eye PSMoveAPI subprocesses exchange hue state, observations, and health
    with the parent through bounded MessagePack pipes. Children own no store,
    provider advertisement, command route, or light output. Typed
    `muninn.move_tracker_health.v1` records expose camera backend, calibration,
    update/observation counts, RGB range, and expected-hue pixel evidence.
    Live field proof on 2026-07-13 established Eye 0 at exposure 0.3 and Eye 1
    at 0.1; both calibrated four Moves and produced observations. A Mimir
    visibility window now sees all four IDs on both eyes. Muninn's dedicated
    evidence aggregator owns frame sequencing and transport independently of
    the 15-second CultCache telemetry loop; controller state is bundled but
    cannot create an optical frame. Its deadline clock is capped by the
    configured camera cadence. Field proof on 2026-07-13 kept one Muninn parent
    PID alive, received 622 unique frames in 15 seconds, carried 2,647 camera
    observations and 1,384 same-ID cross-camera correspondences, and saw every
    stable Move ID from both eyes. Producer health reported 5,302 frames, 5,301
    remote handoffs, 771 sends during the subscription, and zero local-ring
    admissions. Cadence and full overlap are earned; calibrated camera matrices
    still require intrinsics and spatially diverse correspondence capture.
  - `MimirMoveStereoCalibrationAssessment` owns the pre-fit observability gate
    as `mimir.move_stereo_calibration_assessment.v1`. It consumes a typed
    visibility receipt, counts only same-frame/same-Move stereo pairs, measures
    per-Eye image-grid and radius coverage, and refuses promotion when
    intrinsics, measured orb radius, synchronized sample count, or spatial
    diversity are missing. The corrected 2026-07-13 live receipt contained 130
    honest same-frame pairs at zero frame skew, but Eye 0 occupied only 4/12
    grid cells and Eye 1 only 2/12; no camera matrices were promoted.
  - `MimirMuninnMoveEvidenceAdapter.TryAdmitLatestCultMeshFrame` now exposes a
    typed admission receipt with decoded frame id, producer, publish/read
    timestamps, sample counts by kind, source/arrival ranges, native reservoir
    handle, and reservoir edge/window so the named proof spine can be traced.
  - `MimirFrameEventProcessStreamSource` is a temporary diagnostic adapter for
    JSON-line video frame and audio block metadata from native probes into
    runtime rolling buffers; it does not carry pixels/audio payloads or own the
    final local-device hot path.
  - `MimirBioacousticTimeline` is the active runtime watermark. It renders a
    low-gain birdsong-like word language with 128 self-identifying word
    positions, left-speaker and right-speaker variants, four formant-rich
    syllables per word, rhythm variation, and direct word identity instead of a
    de Bruijn grammar. The active receiver is a song-contour anchor machine:
    one heard call should expose syllable timing, contour bends, formants,
    payload ornaments, speaker tint, and log-mel evidence as a cluster of
    time/frequency anchors. `MimirRuntime` emits separate panned vocabularies
    per speaker. `MimirAudioSynchronizationAnalyzer` reports active timing as
    `evidence=bioacoustic`; the old chirp-bin path remains a
    calibration/reference artifact with ASIO tooling.
  - The diagnostic audio path can optionally carry base64 float sample payloads
    for sync smoke tests. `MimirChirpletTimeline` owns the older structured
    chirplet reference fingerprint: an order-3 de Bruijn sequence over 32
    time/frequency constellation symbols, plus PCM segment rendering, matched
    timing atoms, symbol/event decoding, and per-band response kernels. Symbol
    identity is carried by start band, glide shape, duration, and following
    inter-chirp gap. Any three consecutive correctly detected symbols identify a
    timeline event within the current operating horizon. `MimirChirpletSymbolCodebook`
    owns the 32 symbol definitions so every symbol has a unique chirp shape, with
    rhythm as additional evidence. `MimirChirpletStreamDecoder` is the first
    constrained chirplet-transform receiver: it owns a bounded PCM window, emits
    transform frames with multiple phase-invariant symbol candidates and refined
    per-candidate sample offsets, decodes code-valid triplet anchors through
    gap/clock coherence, and fits a per-source sample clock from those anchors.
    Its synthetic smoke path is `dotnet run --project
    .\src\Mimir.BufferSmoke\Mimir.BufferSmoke.csproj -- --chirplet-self-test`.
    It currently decodes all 15 emitted chirps in a two-second window into 13
    anchors for events 0-12 with a 47999.999990 Hz clock fit and 0.000014 sample
    MAE. `MimirAudioSynchronizationAnalyzer`
    now treats `loopback-scarlett-speakers` as timing authority and derives
    delay only from matched decoded timeline anchors. Positive delay means
    the candidate mic is late relative to loopback. Reports include rounded
    delay, fractional delay, confidence, and per-band matched energy. `MimirSynchronizationHub`
    caches the latest per-source reports and `MimirAudioSynchronizationStateTracker`
    owns the smoothed per-source belief: latest delay, smoothed delay,
    confidence, per-band response evidence, and delay-slope/SRO estimate in
    ppm. `MimirRuntime` now runs this analysis online as a bounded rotating
    service on a fixed cadence, while UI and telemetry read cached reports/states
    instead of invoking analysis. `MIMIR_SYNC_TELEMETRY_SECONDS` prints live
    buffer/report/state telemetry. `MimirAudioSynchronizationSettings.Mode`
    now owns the active evidence policy: `chirp-only` emits the calibration
    witness, `passive` stays silent and uses program-audio phase correlation,
    and `hybrid` emits active pilot chunks only while passive confidence is
    weak. `MimirPassiveAudioSynchronizationEstimator` is the first passive path:
    it uses PHAT-weighted cross-spectrum correlation between loopback and mic
    windows before any watermark is needed. Negative passive lags are
    contradictory evidence and carry zero confidence; single-window passive
    confidence is capped below certainty until repeated state earns it.
    `MimirBioacousticTimeline` is now the active calibration witness for both
    chirp-only and hybrid: 128 self-identifying word positions, left/right
    speaker variants, four formant-rich syllables per word, rhythm variation,
    and direct word identity so any correctly decoded word identifies one
    canonical timeline location. The analyzer refines final active delay with constrained local
    waveform correlation around the decoded anchor delay. Each detected motif
    carries per-band response evidence, and the next calibration cut should use
    those profiles to tune contours, formants, usable bands, gain, and rhythm
    weighting. `Mimir.BufferSmoke --bioacoustic-cepstral-smoke` now proves the
    non-brute-force receiver direction: degraded mel-cepstral calls are decoded
    by an augmented MFCC/projection-hash word index before any expensive
    confirmation. `Mimir.BufferSmoke --bioacoustic-train` now runs a
    receipt-backed hypothesis panel over indexed cepstral decoder shapes and
    writes typed CultCache results plus pre-warp/post-warp/reconstructed WAV
    artifacts under `artifacts/bioacoustic-training/`. The first receipt
    `bioacoustic-20260524-103438` showed compact indexing fastest on clean
    audio and exposed timing error under domain warp. The corrected receipt
    `bioacoustic-20260524-150729` adds global clock hypothesis scoring over a
    longer window; compact indexing wins clean throughput, baseline indexing
    remains steadier under degradation, highband indexing has warped-path value,
    and anchor density needs its own metric. `MimirChirpBinTimeline` remains the controlled chirp-bin
    calibration/reference artifact with ASIO tooling and
    `MimirChirpBinCalibrationModel`; keep those captures as response evidence,
    not the active runtime sound. Reports and sync states expose delay in
    microseconds as well as fractional samples. Hybrid emits the bioacoustic
    witness as low-gain half-second bursts while passive confidence is weak,
    never as catch-up backlog. The analyzer no longer applies the passive
    two-second window floor to active fallback; `dotnet run --project
    .\src\Mimir.BufferSmoke\Mimir.BufferSmoke.csproj -- --chirp-only-sync-self-test --sample-rate 48000`
    recovers a 317.375-sample synthetic delay with printed 0.000 us error using
    `evidence=bioacoustic`, while `--hybrid-sync-self-test --sample-rate 48000`
    correctly accepts strong passive evidence at 2.772 us error. The synthetic
    standalone receiver proof `--standalone-bioacoustic-self-test --sample-rate
    48000 --delay-samples 1269.5` recovers delayed source time below printed
    microsecond precision using only the codebook/schedule. `--bioacoustic-actuator-self-test
    --sample-rate 48000 --delay-samples 317.375` now proves the first
    measurement-to-sample-movement loop: estimate bioacoustic delay, apply
    fractional correction, and remeasure residual below printed microsecond
    precision. `faust/mimir_alignment_actuator.dsp` is the first Faust-owned
    actuator surface for six channels of bounded fractional delay/gain. The synthetic
    codebook proof is `dotnet run --project
    .\src\Mimir.BufferSmoke\Mimir.BufferSmoke.csproj -- --bioacoustic-self-test`.
    `Mimir.BufferSmoke --render-chirp-bin-f32` plus
    `native/probes/asio_audio_cadence --play-f32-mono --record-f32-interleaved`
    now provides a real Scarlett ASIO artifact proof for active mode. At 192 kHz,
    Loopback 1 -> Loopback 2 decoded at 0.000 us with 12 anchors and 0.999
    confidence. `Mimir.BufferSmoke --calibrate-chirp-bin-asio-f32` now renders
    or ingests a calibration capture and persists the response/confusion/delay
    model under `calibration/chirp-bin/`; `--analyze-asio-f32 --calibration`
    loads it back into the chirp-bin reference decoder. Physical inputs still fail accepted
    pairwise timing against loopback in the stored artifact, but decoded mic
    channels now leave calibration models; physical input 1 produced two reliable
    symbols and a different strongest measured band set.
    `native/asio_capture` and `MimirAsioStreamSource` are now the runtime
    Scarlett path: Focusrite ASIO callbacks feed sample-bearing 192 kHz Float32
    blocks into `Mimir.Runtime` in process. `config/mimir-runtime.asio.example.json`
    proves continuous ASIO runtime ingest: a two-second BufferSmoke run at
    192 kHz ingested more than 12,000 sample-bearing blocks across `asio-ch0`
    through `asio-ch3` and retained 2,048 blocks per channel, all from the
    Focusrite ASIO callback stream.
    `Mimir.BufferSmoke --calibrate-contestant-asio-f32` now persists the active
    packet-song physical response model under `calibration/bioacoustic/`,
    including per-channel delay search, polarity, payload reliability,
    response-normalization bands, gain, confidence, and pairwise propagation
    delay. The latest canary-packet Scarlett receipt runs at 10.7x realtime
    across four 192 kHz channels: loopback is 37/37 with 2.524 us MAE,
    co-streamer shotgun is 37/37 payload with 58.785 us MAE, and the cardioid
    is 26/37 with 90.558 us MAE. This is a serious calibration surface, not yet
    true physical microsecond sync.
    A fresh 192 kHz room receipt at
    `calibration/bioacoustic/scarlett-canary-packet-192k-contour-fresh.json`
    keeps loopback at 2.524 us MAE, improves the co-streamer shotgun to 37/37
    payload with 34.083 us MAE, and improves the cardioid to 31/37 payload
    with 92.996 us MAE. The next precision cut is intra-call contour anchors,
    not more sequence machinery.
    `calibration/bioacoustic/scarlett-canary-packet-anchor-rich-192k.json`
    is the first anchor-rich receipt: timing chips, formant pivots,
    harmonic-envelope notches, payload ornaments, renderer template caching, and
    per-event intra-call anchor measurements. It clears 10x realtime and
    improves loopback to about 2.23 us MAE, but physical mics regress/hold at
    tens of microseconds, so anchor survivability and path weighting are now the
    problem.
    Path-level loopback truth now compares candidate mic anchors directly
    against loopback anchors, then refines delay with event-local waveform
    correlation against the captured loopback packet. On the stored anchor-rich
    capture, Release calibration runs at 21.1x realtime and improves physical
    path precision to 7.576 us for the cardioid and 6.578 us for the shotgun.
    A fresh room capture keeps the shotgun near 5.916 us but worsens the
    cardioid to 18.930 us. The one-microsecond target remains open; next cut is
    phase/group-delay correction or a better direct-path anchor family. A naive
    recursive waveform phase-lock pass was tested and reverted because it could
    improve one cardioid receipt while worsening the shotgun and locking a fresh
    cardioid run onto a later reflection lobe. Recursion is only allowed back as
    a constrained direct-path/group-delay model, not as unconstrained waveform
    resampling with prettier decimals. The sonar/DSP research note
    `research/sonar-dsp-recursive-refinement-2026-05-25.md` points the next
    decoder cut at complex contour matched filters, phase-slope/group-delay
    fitting, acquisition/tracking loop bandwidths, and sparse multipath
    residuals. Its source ledger and local mirrors live under
    `research/sonar-dsp-recursive-refinement-2026-05-25/`.
    `MimirComplexContourMatchedFilterBank` and `MimirDirectPathTracker` are the
    first implementation slice of that shape: complex anchor responses keep
    multiple lobes, the current path prediction gates direct-path ownership, and
    later coherent clusters are reported as reflection taps. Synthetic 192 kHz
    reflection smoke currently lands about 5.249 us from expected delay; stored
    Scarlett shotgun receipts land within about 5.860 us and 7.247 us of seeded
    path fits, while cardioid receipts land within about 15.817 us and 8.963 us.
    Low confidence is expected until phase/group-delay surfaces are learned. The
    tracker now exposes per-band delay/phase residual observations and a
    `MimirDirectPathChannelModel` correction surface for multi-window
    calibration; one-window self-correction is not live authority. The tracker
    now consumes explicit channel models as phase/group-delay correction and
    downweights bands outside the learned usable surface. `Mimir.BufferSmoke
    --learn-complex-contour-channel-model` persists
    `calibration/bioacoustic/complex-contour-channel-model.json` from the
    replay panel, and `--evaluate-complex-contour-channel-model` persists
    `calibration/bioacoustic/complex-contour-channel-model-evaluation.json`.
    Current evaluation improves 3/4 absolute path-seed errors and lowers mean
    direct-cluster MAE; the fresh cardioid case reaches about 0.202 us from
    seed, while the stored cardioid case still worsens to about 17.476 us. The
    model is explicit calibration evidence, not default runtime authority.
    The complex contour receiver is now wired into runtime as an explicit live
    lane: when `enableComplexContourRuntime` is true, Mimir emits the configured
    `bioacousticWitnessProfileId` through `MimirBioacousticContestantRenderer`,
    loads `complexContourChannelModelPath`, extracts Float32 windows from the
    rolling buffers, and publishes `evidence=complex-contour` reports. The
    synthetic runtime-shaped proof `--complex-contour-runtime-self-test` at
    192 kHz recovers a 693.5-sample delay with about 0.219 us error.
    A fresh live Scarlett proof is preserved at
    `calibration/bioacoustic/complex-contour-live-20260525-063229.md`:
    Focusrite ASIO playback/capture measured Loopback 1 -> Loopback 2 at
    -0.014 us with corrected confidence 0.971. The apparent `asio-ch0`
    near-seed/cardioid estimate is invalidated: signal inspection shows flat
    low-level noise with zero-lag loopback correlation 0.000032, so the tracker
    fit noise under seeded timing pressure. `asio-ch1` remains only a weak,
    non-authoritative input witness. The next cut is signal-presence gating,
    independent path truth, and better frequency/direct-path discrimination.
    `calibration/bioacoustic/complex-contour-replay-panel.json` persists the
    current four-case replay receipt.
    Acoustic robustness remains open.
    The old arbitrary-chirplet matcher is a diagnostic/reference artifact only,
    not the runtime hot path.
